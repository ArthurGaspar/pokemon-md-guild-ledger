# Full stack on one machine: PostgreSQL, the Spring API and the web client pointed at it.
#   docker compose up --build
# Web: http://localhost:5173   API: http://localhost:8080 (Swagger UI at /swagger-ui.html)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guild
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      GUILD_DB_URL: jdbc:postgresql://db:5432/guild
      GUILD_DB_USER: guild
      GUILD_DB_PASSWORD: guild
      GUILD_JWT_SECRET: ${GUILD_JWT_SECRET:-compose-secret-change-me-0123456789abcdef}
      GUILD_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
