spring:
  application:
    name: guild-ledger
  datasource:
    url: ${GUILD_DB_URL:jdbc:postgresql://localhost:5432/guild}
    username: ${GUILD_DB_USER:guild}
    password: ${GUILD_DB_PASSWORD:guild}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

guild:
  jwt:
    # Override in any shared deployment. 32+ bytes for HS256.
    secret: ${GUILD_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: PT12H
  cors:
    origins: ${GUILD_CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# No Postgres around: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/guild;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
