# Guild Expeditions, phase 1: catalog, queue and reservation on PostgreSQL, Redis and Kafka.
#   docker compose -f expeditions/docker-compose.yml up --build
# Catalog :8081  Queue :8082  Reservation :8083  Kafka UI :8090
x-service-build: &service-build
  context: ..
  dockerfile: expeditions/Dockerfile

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: guild
  DB_PASSWORD: guild
  ADMISSION_SECRET: ${ADMISSION_SECRET:-compose-admission-secret-change-me-0123456789}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - expeditions-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: expeditions
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  catalog:
    build:
      <<: *service-build
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      CATALOG_SEED_OPENS_IN: ${CATALOG_SEED_OPENS_IN:-PT1M}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  queue:
    build:
      <<: *service-build
      args:
        SERVICE: queue-service
    environment:
      <<: *service-env
      REDIS_HOST: redis
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  reservation:
    build:
      <<: *service-build
      args:
        SERVICE: reservation-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/reservation
      READY_CHECK: ${READY_CHECK:-PT60S}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  expeditions-pg:
