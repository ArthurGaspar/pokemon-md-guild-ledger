server:
  port: ${PORT:8084}

spring:
  application:
    name: processing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/processing}
    username: ${DB_USER:guild}
    password: ${DB_PASSWORD:guild}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest

processing:
  sim:
    url: ${SIM_URL:http://localhost:8085}
    connect-timeout: 1s
    # the time limit on one call; slower answers count as failures
    read-timeout: ${SIM_READ_TIMEOUT:2s}
  run-deadline: ${RUN_DEADLINE:PT2M}
  retry-base: PT1S
  retry-max: PT15S

resilience4j:
  retry:
    instances:
      dungeon-sim:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      dungeon-sim:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  bulkhead:
    instances:
      dungeon-sim:
        max-concurrent-calls: 8
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,retries,bulkheads
  health:
    circuitbreakers:
      enabled: true
