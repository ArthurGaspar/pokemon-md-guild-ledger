server:
  port: ${PORT:8081}

spring:
  application:
    name: catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:guild}
    password: ${DB_PASSWORD:guild}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/outbox
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all

expeditions:
  auth:
    public-get-paths: /api/expeditions, /api/expeditions/*

catalog:
  seed:
    enabled: ${CATALOG_SEED:true}
    opens-in: ${CATALOG_SEED_OPENS_IN:PT1M}

management:
  endpoints:
    web:
      exposure:
        include: health
