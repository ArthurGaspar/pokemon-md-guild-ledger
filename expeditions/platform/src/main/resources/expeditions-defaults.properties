# Shared by every service (see PlatformDefaults). Lowest precedence: application.yml and the environment win.

# Keycloak realm "guild". The issuer is what tokens say (the browser-facing URL); keys are fetched from wherever
# Keycloak is reachable from the service, so the issuer is checked without discovery.
expeditions.auth.mode=${AUTH_MODE:jwt}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8180/realms/guild}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS:http://localhost:8180/realms/guild/protocol/openid-connect/certs}

# Traces, metrics and logs to an OTLP endpoint (Grafana LGTM in compose). Off unless OTLP_EXPORT=true.
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${OTLP_EXPORT:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.logging.export.otlp.enabled=${OTLP_EXPORT:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.otlp.metrics.export.enabled=${OTLP_EXPORT:false}
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=10s

# Trace context in Kafka record headers, both ways
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
